name: Feature request
description: Propose a general capability or public-contract improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe a general user need, not a one-challenge recognition shortcut. Do not upload non-redistributable challenge/private samples. Security vulnerabilities belong in the private path described by `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What reverse-engineering workflow is currently blocked or unnecessarily manual?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the general behavior/evidence boundary rather than challenge names, hashes, paths, or flag-specific logic.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and negative cases
      description: What positive structure/semantics, mutations, and bait/negative cases should distinguish this capability?
  - type: textarea
    id: fixtures
    attributes:
      label: Fixture / provenance plan
      description: Prefer synthetic generators. If a real artifact is necessary, state source, license, redistribution basis, version, and hash without attaching it here by default.
  - type: textarea
    id: budget
    attributes:
      label: Resource and safety budget
      description: What attacker-controlled size/count/depth/time can scale, and what hard bounds should apply?
  - type: checkboxes
    id: compatibility
    attributes:
      label: Public contract impact
      options:
        - label: This may change JSON/report schema.
        - label: This may change CLI or exit-code behavior.
        - label: This may execute target code or affect writeback/install authorization.
