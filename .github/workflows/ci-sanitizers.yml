name: ci-sanitizers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  malformed-static:
    name: GCC 13 ASan+UBSan malformed static gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Record GCC 13 toolchain
        run: |
          cmake --version
          "$CC" --version
          "$CXX" --version
      - name: Select warnings-as-errors contract
        id: strict
        run: |
          if git grep -q AUTO_REFIRST_WARNINGS_AS_ERRORS -- CMakeLists.txt cmake 2>/dev/null; then
            echo "arg=-DAUTO_REFIRST_WARNINGS_AS_ERRORS=ON" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-DCMAKE_COMPILE_WARNING_AS_ERROR=ON" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure strict ASan and UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Release
          ${{ steps.strict.outputs.arg }}
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS_RELEASE="-O1 -g1 -DNDEBUG"
          -DCMAKE_CXX_FLAGS_RELEASE="-O1 -g1 -DNDEBUG"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized parser harness
        run: cmake --build build-san --target auto_refirst_public_malformed_sanitizer --parallel 2
      - name: Malformed-input static sanitizer smoke
        run: python3 tests/run_public_regression.py --binary build-san/auto_refirst_public_malformed_sanitizer --sanitizer-smoke
      - name: Assert source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
