name: ci-sanitizers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  malformed-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          cmake --version
          "$CC" --version
          "$CXX" --version
          git rev-parse HEAD
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS_RELEASE="-O1 -g1 -DNDEBUG"
          -DCMAKE_CXX_FLAGS_RELEASE="-O1 -g1 -DNDEBUG"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized binary
        run: cmake --build build-san --target auto_refirst_public_malformed_sanitizer --parallel 2
      - name: Malformed-input static gate
        run: python3 tests/run_public_regression.py --binary build-san/auto_refirst_public_malformed_sanitizer --sanitizer-smoke
