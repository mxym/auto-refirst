name: ci-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-static:
    name: Native MSVC P0/P1 static
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact clean checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if (-not (Test-Path -LiteralPath .git)) { throw "checkout is missing its source-root .git marker" }
          $actualSha = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "cannot resolve checkout HEAD" }
          if ($actualSha -ne $env:EXPECTED_SHA) { throw "checkout mismatch: $actualSha != $env:EXPECTED_SHA" }
          [string[]] $sourceStatus = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw "cannot inspect checkout cleanliness" }
          if ($sourceStatus.Count -ne 0) { throw "checkout is not clean" }
      - name: Public source hygiene
        run: python tests/check_public_source_hygiene.py --require-clean
      - name: Record native MSVC toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion
          } else {
            Write-Host "vswhere not found at $vswhere; CMake generator detection remains authoritative"
          }
      - name: Configure strict Release
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DAUTO_REFIRST_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Verify exact build identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tests/check_ci_build_identity.py
          --binary build/Release/auto-refirst.exe
          --expected-commit $env:EXPECTED_SHA
          --expected-platform Windows/AMD64
          --expected-schema 1.0
          --self-test
      - name: Public P0/P1 static regression
        run: python tests/run_public_regression.py --binary build/Release/auto-refirst.exe --tier all --require-clean-source
      - name: Directory resource static contract
        run: python tests/test_bounded_directory_output.py build/Release/auto-refirst.exe
      - name: Provenance and exact install staging
        run: >-
          cmake --build build --config Release --parallel 2 --target
          auto_refirst_public_provenance_check
          auto_refirst_public_install_stage_check
      - name: Assert source remains clean
        shell: pwsh
        run: |
          [string[]] $sourceStatus = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw "cannot inspect final source cleanliness" }
          if ($sourceStatus.Count -ne 0) { throw "source tree was modified by the CI gate" }
