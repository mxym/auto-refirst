name: ci-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-core:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion
          } else {
            Write-Host "vswhere not found at $vswhere; CMake generator detection remains authoritative"
          }
          git rev-parse HEAD
      - name: Configure Release
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Version smoke
        run: .\build\Release\auto-refirst.exe --version
      - name: Public P0/P1 regression
        run: python tests/run_public_regression.py --binary build/Release/auto-refirst.exe
      - name: Directory resource contract
        run: python tests/test_bounded_directory_output.py build/Release/auto-refirst.exe
