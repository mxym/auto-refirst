name: PyInstaller Windows patch-level research

on:
  push:
    branches:
      - research/pyinstaller-windows-patchlevels
    paths:
      - .github/workflows/pyinstaller-windows-patchlevel-research.yml

permissions:
  contents: read

jobs:
  build:
    name: Python ${{ matrix.python }} / PyInstaller 6.22.2
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10.0', '3.10.11', '3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install and record environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==6.22.2"
          python -c "import sys,PyInstaller,importlib.metadata; print(sys.version); print(importlib.metadata.version('pyinstaller'))" | Out-File -Encoding utf8 environment.txt
      - name: Build and run onefile sample
        shell: pwsh
        run: |
          @'
          import sys
          print("AUTO_REFIRST_PYINSTALLER_PATCHLEVEL_REFERENCE")
          print(sys.version_info[:3])
          '@ | Out-File -Encoding utf8 sample.py
          python -m PyInstaller --clean --noconfirm --onefile --name sample sample.py *>&1 | Tee-Object -FilePath pyinstaller-build.log
          if (!(Test-Path dist/sample.exe)) { throw "dist/sample.exe missing" }
          $out = & ./dist/sample.exe
          $out | Out-File -Encoding utf8 sample-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw "sample exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-6.22.2-${{ matrix.python }}-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/sample.exe
            environment.txt
            sample-runtime.txt
            pyinstaller-build.log
