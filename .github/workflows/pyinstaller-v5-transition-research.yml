name: PyInstaller v5 loader transition research

on:
  push:
    branches:
      - research/pyinstaller-windows-311312-endpoints
    paths:
      - .github/workflows/pyinstaller-v5-transition-research.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / PyInstaller ${{ matrix.pyinstaller }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pyinstaller: ['5.2', '5.3', '5.4.1', '5.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          architecture: x64
      - name: Install and build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==${{ matrix.pyinstaller }}"
          python - <<'PY' > environment.txt
          import sys, importlib.metadata
          print(sys.version)
          print(importlib.metadata.version('pyinstaller'))
          PY
          cat > sample.py <<'PY'
          import sys
          print('AUTO_REFIRST_PYINSTALLER_V5_TRANSITION')
          print(sys.version_info[:3])
          PY
          python -m PyInstaller --clean --noconfirm --onefile --name sample sample.py 2>&1 | tee pyinstaller-build.log
          test -x dist/sample
          ./dist/sample | tee sample-runtime.txt
      - name: Install and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==${{ matrix.pyinstaller }}"
          python -c "import sys,importlib.metadata; print(sys.version); print(importlib.metadata.version('pyinstaller'))" | Out-File -Encoding utf8 environment.txt
          @'
          import sys
          print("AUTO_REFIRST_PYINSTALLER_V5_TRANSITION")
          print(sys.version_info[:3])
          '@ | Out-File -Encoding utf8 sample.py
          python -m PyInstaller --clean --noconfirm --onefile --name sample sample.py *>&1 | Tee-Object -FilePath pyinstaller-build.log
          if (!(Test-Path dist/sample.exe)) { throw "dist/sample.exe missing" }
          $out = & ./dist/sample.exe
          $out | Out-File -Encoding utf8 sample-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw "sample exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-${{ matrix.pyinstaller }}-${{ runner.os }}-py310-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/sample*
            environment.txt
            sample-runtime.txt
            pyinstaller-build.log
