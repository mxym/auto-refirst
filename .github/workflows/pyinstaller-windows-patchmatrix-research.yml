name: PyInstaller Windows Python 3.10.1 matrix research

on:
  push:
    branches:
      - research/pyinstaller-windows-patchmatrix
    paths:
      - .github/workflows/pyinstaller-windows-patchmatrix-research.yml

permissions:
  contents: read

jobs:
  build:
    name: PyInstaller ${{ matrix.pyinstaller }} / Python 3.10.1
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pyinstaller: ['5.13.2', '6.0.0', '6.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.1'
          architecture: x64
      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "pyinstaller==${{ matrix.pyinstaller }}"
          python -c "import sys,importlib.metadata; print(sys.version); print(importlib.metadata.version('pyinstaller'))" | Out-File -Encoding utf8 environment.txt
          @'
          import sys
          print("AUTO_REFIRST_PYINSTALLER_PATCH_MATRIX")
          print(sys.version_info[:3])
          '@ | Out-File -Encoding utf8 sample.py
          python -m PyInstaller --clean --noconfirm --onefile --name sample sample.py *>&1 | Tee-Object -FilePath pyinstaller-build.log
          if (!(Test-Path dist/sample.exe)) { throw "dist/sample.exe missing" }
          $out = & ./dist/sample.exe
          $out | Out-File -Encoding utf8 sample-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw "sample exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-${{ matrix.pyinstaller }}-py3101-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/sample.exe
            environment.txt
            sample-runtime.txt
            pyinstaller-build.log
