name: ci-linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-static:
    name: P0/P1 static (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Record toolchain
        run: |
          cmake --version
          "$CC" --version
          "$CXX" --version
      - name: Select warnings-as-errors contract
        id: strict
        run: |
          if git grep -q AUTO_REFIRST_WARNINGS_AS_ERRORS -- CMakeLists.txt cmake 2>/dev/null; then
            echo "arg=-DAUTO_REFIRST_WARNINGS_AS_ERRORS=ON" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-DCMAKE_COMPILE_WARNING_AS_ERROR=ON" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure strict Release
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ steps.strict.outputs.arg }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify embedded binary source identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          version_output="$(build/auto-refirst --version)"
          printf '%s\n' "$version_output"
          embedded_sha="$(printf '%s\n' "$version_output" | sed -n 's/^git_commit=//p')"
          if test -n "$embedded_sha"; then
            test "$embedded_sha" = "$EXPECTED_SHA"
          elif git grep -q 'git_commit=' -- src include cmake 2>/dev/null; then
            echo "binary omitted git_commit although the source declares the identity contract" >&2
            exit 1
          else
            echo "::notice::This public baseline predates embedded build identity; the RC candidate must expose git_commit and will be checked exactly."
          fi
      - name: Public P0/P1 static regression
        run: python3 tests/run_public_regression.py --binary build/auto-refirst --tier all
      - name: Directory resource static contract
        run: python3 tests/test_bounded_directory_output.py build/auto-refirst
      - name: Install staging
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/auto-refirst-install"
          test -x "$RUNNER_TEMP/auto-refirst-install/bin/auto-refirst"
          "$RUNNER_TEMP/auto-refirst-install/bin/auto-refirst" --version
      - name: Assert source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  authorized-runtime:
    name: Authorized runtime tests (not static-only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Select warnings-as-errors contract
        id: strict
        run: |
          if git grep -q AUTO_REFIRST_WARNINGS_AS_ERRORS -- CMakeLists.txt cmake 2>/dev/null; then
            echo "arg=-DAUTO_REFIRST_WARNINGS_AS_ERRORS=ON" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-DCMAKE_COMPILE_WARNING_AS_ERROR=ON" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure strict Release
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ steps.strict.outputs.arg }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Directory orchestration with authorized runtime
        run: python3 tests/test_directory_orchestration.py build/auto-refirst
      - name: Runtime authorization boundary
        run: python3 tests/test_runtime_authorization.py build/auto-refirst
      - name: Assert source remains clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
