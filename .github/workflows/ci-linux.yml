name: ci-linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same PR/branch supersedes the older CI result. Keep
# PR, push-to-main, and manual runs in distinct groups so post-merge validation
# never cancels the PR gate (and vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-static:
    name: P0/P1 static (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact clean checkout
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test -e .git
          actual_sha="$(git rev-parse --verify HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$source_status"
      - name: Public source hygiene
        run: python3 tests/check_public_source_hygiene.py --require-clean
      - name: Record toolchain
        run: |
          cmake --version
          "$CC" --version
          "$CXX" --version
      - name: Configure strict Release
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DAUTO_REFIRST_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify exact build identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tests/check_ci_build_identity.py
          --binary build/auto-refirst
          --expected-commit "$EXPECTED_SHA"
          --expected-platform Linux/x86_64
          --expected-schema 1.0
          --self-test
      - name: Public P0/P1 static regression
        run: python3 tests/run_public_regression.py --binary build/auto-refirst --tier all --require-clean-source
      - name: Directory resource static contract
        run: python3 tests/test_bounded_directory_output.py build/auto-refirst
      - name: Provenance and exact install staging
        run: >-
          cmake --build build --parallel 2 --target
          auto_refirst_public_provenance_check
          auto_refirst_public_install_stage_check
      # The gcc-13 static job already owns the exact strict Release build that
      # the authorized runtime tests need. Reuse it on non-PR events instead
      # of checking out/configuring/building the same tree in a second job.
      - name: Directory orchestration with authorized runtime
        if: github.event_name != 'pull_request' && matrix.compiler == 'gcc-13'
        run: python3 tests/test_directory_orchestration.py build/auto-refirst
      - name: Runtime authorization boundary
        if: github.event_name != 'pull_request' && matrix.compiler == 'gcc-13'
        run: python3 tests/test_runtime_authorization.py build/auto-refirst
      - name: Assert source remains clean
        run: |
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$source_status"
