name: PyInstaller Linux 3.13/3.14 source-generation research

on:
  push:
    branches:
      - research/pyinstaller-windows-311312-endpoints
    paths:
      - .github/workflows/pyinstaller-linux-313314-sourcegen-research.yml

permissions:
  contents: read

jobs:
  build:
    name: Linux Python ${{ matrix.python }} / PyInstaller 6.22.2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13.0', '3.13.4', '3.13.15', '3.14.0', '3.14.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: 'pyinstaller==6.22.2'
          python - <<'PY' > environment.txt
          import sys, importlib.metadata
          print(sys.version)
          print(importlib.metadata.version('pyinstaller'))
          PY
          cat > sample.py <<'PY'
          import sys
          print('AUTO_REFIRST_PYINSTALLER_313314_SOURCEGEN_LINUX')
          print(sys.version_info[:3])
          PY
          python -m PyInstaller --clean --noconfirm --onefile --name sample sample.py 2>&1 | tee pyinstaller-build.log
          test -x dist/sample
          ./dist/sample | tee sample-runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-6.22.2-${{ matrix.python }}-linux-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/sample
            environment.txt
            sample-runtime.txt
            pyinstaller-build.log
